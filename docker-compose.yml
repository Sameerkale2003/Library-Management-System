services:
  db:
    image: mysql:8.4
    container_name: library_mysql
    restart: always
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_USER: workbench
      MYSQL_PASSWORD: Sameer@12345
      MYSQL_ROOT_PASSWORD: Sameer@123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: library_backend
    restart: always
    environment:
      DB_NAME: library_db
      DB_USER: workbench
      DB_PASSWORD: Sameer@12345
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: library_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
